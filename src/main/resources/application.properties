spring.application.name=demo1
app.role=${APP_ROLE:client}

spring.grpc.server.port=${GRPC_SERVER_PORT:9090}
spring.grpc.server.reflection.enabled=true
spring.grpc.client.channel.orderService.target=static://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:9090}
spring.grpc.server.health.enabled=true